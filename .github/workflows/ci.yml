name: CI

on:
  # pull_request:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ml-interview-qa:ci .

      - name: Run tests
        run: docker run --rm ml-interview-qa:ci pytest
